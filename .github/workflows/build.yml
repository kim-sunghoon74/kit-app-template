name: Build USD Composer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set UTF-8 encoding
      shell: powershell
      run: |
        $env:PYTHONUTF8 = "1"
        chcp 65001

    - name: Create USD Composer app
      shell: cmd
      run: |
        set PYTHONUTF8=1
        (echo mycomposer & echo My Composer & echo & echo & echo N) | repo.bat template new

    - name: Build
      shell: powershell
      run: |
        $env:PYTHONUTF8 = "1"
        .\repo.bat build

    - name: Find output files
      shell: powershell
      run: |
        Write-Host "=== _build 폴더 구조 ==="
        Get-ChildItem -Recurse _build -Filter "*.zip" | Select-Object FullName

    - name: Package
      shell: powershell
      run: |
        $env:PYTHONUTF8 = "1"
        .\repo.bat package --name mycomposer

    - name: Find zip
      shell: powershell
      run: |
        Get-ChildItem -Recurse -Filter "*.zip" | Select-Object FullName

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mycomposer
        path: "**/*.zip"
        retention-days: 5
