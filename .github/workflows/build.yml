name: Build USD Composer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: true

    - name: Set UTF-8 encoding
      shell: powershell
      run: |
        $env:PYTHONUTF8 = "1"
        chcp 65001

    - name: Create replay file
      shell: powershell
      run: |
        # template new 입력값을 미리 파일로 저장
        $replay = @"
        format_version = 1
        [[inputs]]
        type = "application"
        template = "usd_composer"
        name = "mycomposer"
        display_name = "My Composer"
        setup_extension_name = "my_company.my_usd_composer_setup"
        setup_extension_display_name = "My USD Composer Setup"
        add_layers = false
        "@
        New-Item -ItemType Directory -Force -Path ".repo_replay"
        $replay | Out-File -FilePath ".repo_replay\replay.toml" -Encoding utf8

    - name: Template new via replay
      shell: powershell
      run: |
        $env:PYTHONUTF8 = "1"
        .\repo.bat template new --replay .repo_replay\replay.toml

    - name: Build
      shell: powershell
      run: |
        $env:PYTHONUTF8 = "1"
        .\repo.bat build

    - name: Package
      shell: powershell
      run: |
        $env:PYTHONUTF8 = "1"
        .\repo.bat package --name mycomposer

    - name: Find zip
      shell: powershell
      run: |
        Get-ChildItem -Recurse -Filter "*.zip" | Select-Object FullName

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: mycomposer
        path: "**/*.zip"
        retention-days: 5
